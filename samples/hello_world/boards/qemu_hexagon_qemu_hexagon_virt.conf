# Hexagon-specific configuration for hello_world sample with picolibc

# Use picolibc instead of minimal libc
CONFIG_MINIMAL_LIBC=n
CONFIG_PICOLIBC=y

# Console via PL011 UART
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Build system configuration
CONFIG_LLVM_USE_LLD=y
CONFIG_COMPILER_RT_RTLIB=y

# System configuration
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=1000000
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_SRAM_BASE_ADDRESS=0xa0000000

# Memory configuration
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Hexagon-specific features
CONFIG_HEXAGON_TIMER=y

# Debug and development options
CONFIG_EXCEPTION_DEBUG=y

# QEMU-specific configuration
CONFIG_QEMU_ICOUNT_SHIFT=3

# Advanced features
CONFIG_HW_STACK_PROTECTION=y
